name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      pnpm_config_ignore_pnpmfile: 'true'
      pnpm_config_verify_deps_before_run: 'false'
      PERF_BUDGET_SCALE: '1.5'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: pnpm --filter @workspacekit/react exec playwright install --with-deps
      - run: pnpm check:full
      - name: Forbidden strings
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
        run: pnpm check:forbidden
